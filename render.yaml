# Blueprint do serviço no Render. Ter este arquivo no repositório não cria nem
# atualiza nada: só descreve o serviço para quando houver autorização de deploy.
#
# `autoDeploy: false` é deliberado — cada publicação é uma decisão, não um
# efeito colateral de um push.
services:
  - type: web
    name: jhconsulting-site
    runtime: node
    # Render não tem região no Brasil. Virginia é a mais próxima de sa-east-1,
    # onde está o Supabase. Ver a nota de latência em docs/DEPLOY-RENDER.md.
    region: virginia
    plan: starter
    branch: main
    autoDeploy: false
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /robots.txt
    envVars:
      # Precisa bater com .nvmrc e com o campo engines do package.json.
      - key: NODE_VERSION
        value: "24"
      - key: NEXT_PUBLIC_SITE_URL
        value: https://jhconsulting.com.br
      # Os valores abaixo são definidos no painel do Render, nunca aqui.
      # Os dois NEXT_PUBLIC_ do Supabase não são segredo, mas precisam existir
      # já no build: as páginas públicas leem do banco e o next/image monta a
      # allowlist a partir da URL.
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: CONTACT_FROM_EMAIL
        sync: false
      - key: CONTACT_TO_EMAIL
        sync: false
